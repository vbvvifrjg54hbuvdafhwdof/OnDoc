<!DOCTYPE html>
<html lang="ja" data-theme="indigo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OnDoc - スラッシュリーディング & 音読管理</title>

  <!-- PWA & アプリインストール設定 -->
  <meta name="theme-color" content="#4f46e5" id="theme-color-meta">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OnDoc">

  <!-- iOS用 Apple Touch Icon -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%234f46e5'/><path d='M25 38 C35 32, 45 37, 50 42 C55 37, 65 32, 75 38 L75 68 C65 62, 55 67, 50 72 C45 67, 35 62, 25 68 Z' fill='none' stroke='white' stroke-width='6' stroke-linejoin='round'/><line x1='50' y1='42' x2='50' y2='72' stroke='white' stroke-width='6'/></svg>">

  <!-- PWA Web Manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%234f46e5'/><path d='M25 38 C35 32, 45 37, 50 42 C55 37, 65 32, 75 38 L75 68 C65 62, 55 67, 50 72 C45 67, 35 62, 25 68 Z' fill='none' stroke='white' stroke-width='6' stroke-linejoin='round'/><line x1='50' y1='42' x2='50' y2='72' stroke='white' stroke-width='6'/></svg>">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    /* テーマカラー用 CSS 変数定義 */
    html[data-theme="indigo"] {
      --brand-primary: #4f46e5;
      --brand-primary-hover: #4338ca;
      --brand-light: #eeeffe;
      --brand-text: #4f46e5;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --border-card: #e2e8f0;
      --text-main: #1e293b;
    }

    html[data-theme="mint"] {
      --brand-primary: #0d9488;
      --brand-primary-hover: #0f766e;
      --brand-light: #ccfbf1;
      --brand-text: #0d9488;
      --bg-body: #f0fdf4;
      --bg-card: #ffffff;
      --border-card: #d1fae5;
      --text-main: #064e3b;
    }

    html[data-theme="rose"] {
      --brand-primary: #e11d48;
      --brand-primary-hover: #be123c;
      --brand-light: #ffe4e6;
      --brand-text: #e11d48;
      --bg-body: #fff1f2;
      --bg-card: #ffffff;
      --border-card: #fecdd3;
      --text-main: #881337;
    }

    html[data-theme="amber"] {
      --brand-primary: #d97706;
      --brand-primary-hover: #b45309;
      --brand-light: #fef3c7;
      --brand-text: #d97706;
      --bg-body: #fffbeb;
      --bg-card: #ffffff;
      --border-card: #fde68a;
      --text-main: #78350f;
    }

    html[data-theme="dark"] {
      --brand-primary: #6366f1;
      --brand-primary-hover: #818cf8;
      --brand-light: #1e1b4b;
      --brand-text: #a5b4fc;
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --border-card: #334155;
      --text-main: #f8fafc;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: var(--bg-body);
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .theme-card {
      background-color: var(--bg-card);
      border-color: var(--border-card);
    }

    .theme-brand-bg { background-color: var(--brand-primary) !important; }
    .theme-brand-text { color: var(--brand-text) !important; }
    .theme-brand-light { background-color: var(--brand-light) !important; }

    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .chunk-touch:active {
      background-color: var(--brand-light) !important;
    }

    /* 英文と和訳の密着レイアウト */
    .sentence-block {
      display: block !important;
      margin-bottom: 1.2rem !important;
      line-height: 1.3 !important;
      word-break: break-word !important;
    }

    .chunk-box {
      position: relative !important;
      display: inline-block !important;
      max-width: 100% !important;
      vertical-align: top !important;
      margin-left: 2px !important;
      margin-right: 2px !important;
      margin-bottom: 0.85rem !important;
      padding: 0 2px !important;
      border-radius: 4px;
      box-sizing: border-box !important;
    }

    .mode-no-trans .chunk-box {
      margin-bottom: 0.2rem !important;
    }

    .chunk-en {
      display: inline-block !important;
      max-width: 100% !important;
      white-space: normal !important;
      word-break: break-word !important;
      overflow-wrap: break-word !important;
      line-height: 1.2 !important;
    }

    .chunk-ja {
      position: absolute !important;
      top: 100% !important;
      left: 0 !important;
      width: 100% !important;
      margin-top: 1px !important;
      font-size: 0.62rem !important;
      line-height: 1.15 !important;
      color: var(--brand-primary) !important;
      font-weight: 600 !important;
      white-space: normal !important;
      word-break: break-all !important;
      overflow-wrap: break-word !important;
      pointer-events: none !important;
      z-index: 10 !important;
    }

    .slash-mark {
      display: inline-block !important;
      vertical-align: top !important;
      color: #a5b4fc !important;
      font-weight: 300 !important;
      margin: 0 2px !important;
      user-select: none !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-24 md:pb-6 selection:bg-indigo-100">

  <!-- ヘッダー -->
  <header class="theme-card border-b sticky top-0 z-30 shadow-sm backdrop-blur-md bg-opacity-95">
    <div class="max-w-4xl mx-auto px-3 py-2 flex flex-col gap-2">
      
      <!-- タイトル & 設定歯車 -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 theme-brand-bg rounded-xl flex items-center justify-center text-white shadow-md shadow-indigo-100">
            <i class="fa-solid fa-book-open text-xs"></i>
          </div>
          <h1 class="text-lg font-black tracking-tight">OnDoc</h1>
          <button id="btn-pwa-install" class="hidden px-2 py-0.5 theme-brand-bg hover:opacity-90 text-white text-[10px] font-bold rounded-lg shadow-sm transition flex items-center gap-1 active:scale-95">
            <i class="fa-solid fa-download"></i> アプリ化
          </button>
        </div>

        <div class="flex items-center gap-2">
          <span id="header-folder-tag" class="text-[10px] theme-brand-light theme-brand-text px-2.5 py-0.5 rounded-full font-semibold truncate max-w-[140px]"></span>
          <!-- テーマ変更 歯車ボタン -->
          <button id="btn-open-settings" class="w-8 h-8 rounded-xl flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition" title="テーマ設定">
            <i class="fa-solid fa-gear text-sm"></i>
          </button>
        </div>
      </div>

      <!-- 読解用コントロールバー -->
      <div id="toolbar-controls" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
        <button id="toggle-slash" class="flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1 theme-card border shadow-sm">
          <span class="font-bold theme-brand-text">/</span> スラッシュ
        </button>

        <button id="toggle-highlight" class="flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1 theme-card border shadow-sm">
          <span class="w-2 h-2 rounded-full bg-rose-500"></span> 重要語
        </button>

        <div class="flex-shrink-0 flex bg-slate-100/80 p-0.5 rounded-lg text-xs font-semibold border border-slate-200/60">
          <button id="mode-tap" class="px-2 py-0.5 rounded-md transition theme-card theme-brand-text shadow-sm">タップ</button>
          <button id="mode-all" class="px-2 py-0.5 rounded-md transition text-slate-500">全表示</button>
          <button id="mode-none" class="px-2 py-0.5 rounded-md transition text-slate-500">隠す</button>
        </div>

        <button id="toggle-raw" class="flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1 border border-slate-200 text-slate-600 hover:bg-white">
          <i class="fa-solid fa-leaf text-emerald-500"></i> 白文
        </button>
      </div>

    </div>
  </header>

  <!-- メイン領域 -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-3 md:p-6">

    <!-- VIEW 1: 読解画面（音読タイマー統合型） -->
    <section id="view-reader" class="theme-card rounded-2xl p-4 md:p-7 shadow-sm border min-h-[75vh] flex flex-col justify-between space-y-4">
      <div>
        <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4 gap-2">
          <h2 id="current-title" class="text-base md:text-xl font-bold tracking-tight leading-snug"></h2>
          <button id="btn-open-delete" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition" title="削除">
            <i class="fa-solid fa-trash-can text-xs"></i>
          </button>
        </div>

        <!-- 【読解タブ内】統合音読タイマーバー -->
        <div id="reader-timer-panel" class="mb-5 theme-brand-light rounded-2xl p-3 md:p-4 border border-indigo-100/60 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-3">
              <!-- ストップウォッチ -->
              <div id="reader-timer-display" class="text-3xl md:text-4xl font-black font-mono-num theme-brand-text tracking-tight">00:00.0</div>
              <div class="text-xs font-mono-num text-slate-600">
                WPM: <span id="reader-wpm-live" class="font-bold theme-brand-text text-sm">—</span>
              </div>
            </div>

            <div class="flex items-center gap-1.5">
              <!-- 回数調整 -->
              <div class="flex items-center gap-1 bg-white/80 px-2 py-1 rounded-xl border border-slate-200/60 text-xs font-bold">
                <span id="reader-read-count" class="theme-brand-text font-mono-num text-sm">1</span>回目
                <button id="reader-count-minus" class="w-5 h-5 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center text-xs">-</button>
                <button id="reader-count-plus" class="w-5 h-5 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center text-xs">+</button>
              </div>

              <!-- タイマーボタン -->
              <button id="btn-reader-start" class="px-3 py-1.5 theme-brand-bg text-white font-bold text-xs rounded-xl shadow-sm active:scale-95 transition flex items-center gap-1">
                <i class="fa-solid fa-play text-[10px]"></i> 開始
              </button>
              <button id="btn-reader-stop" disabled class="px-3 py-1.5 bg-rose-500 text-white font-bold text-xs rounded-xl shadow-sm opacity-50 cursor-not-allowed transition flex items-center gap-1">
                <i class="fa-solid fa-stop text-[10px]"></i> 停止
              </button>
              <button id="btn-reader-reset" class="px-2.5 py-1.5 bg-white text-slate-600 font-semibold text-xs rounded-xl border border-slate-200 transition">
                リセット
              </button>
            </div>
          </div>

          <!-- 記録のクイック保存アコーディオン -->
          <div class="flex items-center justify-between gap-2 pt-2 border-t border-indigo-100/80">
            <div class="flex items-center gap-2 flex-1">
              <input type="text" id="reader-memo-input" placeholder="音読メモ・気付き..." class="w-full px-2.5 py-1 bg-white border border-slate-200/80 rounded-lg text-xs font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500">
              <!-- 星評価 -->
              <div id="reader-star-rating" class="flex gap-0.5 text-slate-300 text-sm cursor-pointer flex-shrink-0">
                <i data-star="1" class="fa-solid fa-star"></i>
                <i data-star="2" class="fa-solid fa-star"></i>
                <i data-star="3" class="fa-solid fa-star"></i>
                <i data-star="4" class="fa-solid fa-star"></i>
                <i data-star="5" class="fa-solid fa-star"></i>
              </div>
            </div>
            <button id="btn-reader-save-record" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-lg shadow-sm active:scale-95 transition flex-shrink-0">
              記録保存
            </button>
          </div>
        </div>

        <!-- 英文チャンク表示領域 -->
        <div id="reader-content" class="text-base md:text-lg"></div>
      </div>

      <div id="empty-state" class="hidden text-center py-16">
        <i class="fa-solid fa-folder-open text-3xl text-slate-300 mb-2"></i>
        <p class="text-xs text-slate-500 font-medium">文章が選択されていません。<br>「ライブラリ」から選択するか、追加してください。</p>
      </div>
    </section>

    <!-- VIEW 2: ライブラリ画面（位置を移動） -->
    <section id="view-library" class="theme-card rounded-2xl p-4 md:p-6 shadow-sm border hidden space-y-5">
      <div class="flex flex-wrap items-center justify-between border-b border-slate-100 pb-3 gap-2">
        <h2 class="text-base font-bold">ライブラリ</h2>
        
        <div class="flex items-center gap-1.5">
          <button id="btn-export-data" class="py-1 px-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-lg transition flex items-center gap-1">
            <i class="fa-solid fa-download theme-brand-text"></i> バックアップ
          </button>
          <button id="btn-import-data" class="py-1 px-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-lg transition flex items-center gap-1">
            <i class="fa-solid fa-upload text-emerald-500"></i> 復元
          </button>
          <input type="file" id="file-input-backup" accept=".json" class="hidden">

          <button id="btn-add-root-folder" class="py-1 px-2.5 theme-brand-light theme-brand-text font-semibold text-xs rounded-lg transition flex items-center gap-1">
            <i class="fa-solid fa-folder-plus"></i> 新規フォルダ
          </button>
        </div>
      </div>

      <div id="tree-container" class="space-y-1 text-sm"></div>
    </section>

    <!-- VIEW 3: 音読タイマー画面（単独・外部教材対応） -->
    <section id="view-timer" class="hidden space-y-4">
      <div class="theme-card rounded-2xl p-4 md:p-6 shadow-sm border space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
          <div class="flex-1 min-w-[200px]">
            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-0.5">音読する教材を選択</label>
            <select id="standalone-text-select" class="w-full px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
              <!-- JSで動的に追加 -->
            </select>
          </div>
          <div class="flex items-center gap-1.5 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600">
            <span>語数</span>
            <input type="number" id="standalone-word-count" min="0" value="100" class="w-16 bg-white border border-slate-200 rounded px-1.5 py-0.5 text-center font-mono-num theme-brand-text font-bold outline-none">
            <span>words</span>
          </div>
        </div>

        <div class="grid md:grid-cols-2 gap-6 items-center my-2">
          <!-- 周回数 -->
          <div class="flex flex-col items-center md:items-start border-b md:border-b-0 md:border-r border-slate-100 pb-4 md:pb-0">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">現在の音読回数</span>
            <div class="flex items-baseline gap-1">
              <span id="standalone-read-count" class="text-4xl md:text-5xl font-extrabold theme-brand-text font-mono-num">1</span>
              <span class="text-xs font-bold text-slate-400">回目</span>
            </div>
            <div class="flex gap-1.5 mt-3">
              <button id="btn-standalone-count-minus" class="w-8 h-8 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 flex items-center justify-center text-sm font-bold active:scale-95 transition">-</button>
              <button id="btn-standalone-count-plus" class="w-8 h-8 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 flex items-center justify-center text-sm font-bold active:scale-95 transition">+</button>
            </div>
          </div>

          <!-- タイマー -->
          <div class="flex flex-col items-center md:items-end">
            <div id="standalone-timer-display" class="text-5xl md:text-6xl font-black font-mono-num tracking-tight">00:00.0</div>
            <div class="text-xs text-slate-500 font-mono-num mt-1">WPM: <span id="standalone-wpm-live" class="font-bold theme-brand-text text-sm">—</span></div>

            <div class="flex flex-wrap gap-2 mt-4 justify-center md:justify-end">
              <button id="btn-standalone-start" class="px-4 py-2 theme-brand-bg text-white font-bold text-xs rounded-xl shadow-md active:scale-95 transition flex items-center gap-1.5">
                <i class="fa-solid fa-play text-xs"></i> スタート
              </button>
              <button id="btn-standalone-stop" disabled class="px-4 py-2 bg-rose-500 text-white font-bold text-xs rounded-xl shadow-md opacity-50 cursor-not-allowed transition flex items-center gap-1.5">
                <i class="fa-solid fa-stop text-xs"></i> ストップ
              </button>
              <button id="btn-standalone-reset" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs rounded-xl transition">
                リセット
              </button>
            </div>
          </div>
        </div>

        <!-- 記録メモ -->
        <div class="border-t border-slate-100 pt-3 space-y-3">
          <textarea id="standalone-memo" rows="2" placeholder="音読メモ・気付き..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500"></textarea>
          <div class="flex items-center justify-between flex-wrap gap-2">
            <div id="standalone-star-rating" class="flex gap-1 text-slate-300 text-lg cursor-pointer">
              <i data-star="1" class="fa-solid fa-star"></i>
              <i data-star="2" class="fa-solid fa-star"></i>
              <i data-star="3" class="fa-solid fa-star"></i>
              <i data-star="4" class="fa-solid fa-star"></i>
              <i data-star="5" class="fa-solid fa-star"></i>
            </div>
            <button id="btn-standalone-save-record" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md transition">
              記録を保存
            </button>
          </div>
        </div>
      </div>

      <!-- 履歴カード -->
      <div class="theme-card rounded-2xl p-4 md:p-6 shadow-sm border space-y-3">
        <h3 class="text-sm font-bold flex items-center gap-1.5">
          <i class="fa-solid fa-clock-rotate-left theme-brand-text"></i> 音読履歴ログ
        </h3>
        <div id="standalone-history-list" class="space-y-2"></div>
      </div>
    </section>

    <!-- VIEW 4: JSON追加画面 -->
    <section id="view-import" class="theme-card rounded-2xl p-4 md:p-6 shadow-sm border hidden space-y-5">
      <div class="border-b border-slate-100 pb-3">
        <h2 class="text-base font-bold">新しい英文（JSON）を登録</h2>
        <p class="text-[11px] text-slate-500 mt-0.5">ChatGPTやClaude等のLLMが出力したJSONコードを貼り付けてください。</p>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">保存先フォルダ</label>
          <select id="import-folder-select" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition">
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">タイトル（任意）</label>
          <input type="text" id="import-title" placeholder="例: 今日のニュース解説" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-base md:text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider">JSONコード</label>
            <button id="btn-paste-clipboard" type="button" class="text-xs font-semibold theme-brand-text flex items-center gap-1 px-2 py-1 theme-brand-light rounded-lg active:opacity-80 transition">
              <i class="fa-solid fa-paste"></i> 貼り付け
            </button>
          </div>
          <textarea id="import-json" rows="8" placeholder='[&#10;  {&#10;    "sentence_id": 1,&#10;    "chunks": [ ... ]&#10;  }&#10;]' class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition"></textarea>
        </div>

        <div id="import-error" class="hidden p-2.5 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-600 font-medium"></div>

  <!-- アプリJSロジック -->
  <script>
    // Service Worker 登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.error('SW failed:', err));
      });
    }

    // PWA インストールプロンプト制御
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('btn-pwa-install');
      if (installBtn) installBtn.classList.remove('hidden');
    });

    // 初期サンプルデータ
    const SAMPLE_FOLDERS = [
      { id: "f-1", name: "ニュース・IT", parentId: null },
      { id: "f-2", name: "人工知能 (AI)", parentId: "f-1" }
    ];

    const SAMPLE_TEXTS = [
      {
        id: "text-1",
        folderId: "f-2",
        title: "サンプル：AIと将来の仕事",
        wordCount: 118,
        readCount: 0,
        history: [],
        data: [
          {
            "sentence_id": 1,
            "chunks": [
              { "en": "In recent years,", "is_important": false, "ja": "近年、" },
              { "en": "artificial intelligence has advanced", "is_important": false, "ja": "人工知能は進化してきた" },
              { "en": "at an unprecedented speed,", "is_important": false, "ja": "前例のない速度で、" },
              { "en": "changing the way", "is_important": false, "ja": "〜という方法を変えながら" },
              { "en": "we live and work.", "is_important": false, "ja": "私たちが生活し働く（方法を）。" }
            ]
          },
          {
            "sentence_id": 2,
            "chunks": [
              { "en": "Although many experts predict", "is_important": true, "ja": "多くの専門家は〜と予測しているが、" },
              { "en": "that AI will automate routine tasks", "is_important": false, "ja": "AIが定型業務を自動化し" },
              { "en": "and increase productivity,", "is_important": false, "ja": "生産性を高めると（予測しているが）、" },
              { "en": "others worry", "is_important": false, "ja": "ほかの人々は懸念している" },
              { "en": "that it could lead to", "is_important": false, "ja": "それが〜につながる可能性があると" },
              { "en": "widespread job loss.", "is_important": false, "ja": "広範な雇用喪失に。" }
            ]
          },
          {
            "sentence_id": 3,
            "chunks": [
              { "en": "However,", "is_important": true, "ja": "しかしながら、" },
              { "en": "history shows", "is_important": false, "ja": "歴史が示しているのは" },
              { "en": "that technological revolutions", "is_important": false, "ja": "技術革命が" },
              { "en": "usually create new types of jobs", "is_important": false, "ja": "通常、新しい種類の仕事を生み出すということだ" },
              { "en": "while destroying old ones.", "is_important": true, "ja": "古いものを破壊する一方で。" }
            ]
          },
          {
            "sentence_id": 4,
            "chunks": [
              { "en": "For instance,", "is_important": true, "ja": "例えば、" },
              { "en": "while traditional manufacturing jobs have declined,", "is_important": true, "ja": "従来の製造業の仕事が減少した一方で、" },
              { "en": "demand for software engineers and data analysts", "is_important": false, "ja": "ソフトウェアエンジニアやデータアナリストの需要は" },
              { "en": "has skyrocketed.", "is_important": false, "ja": "急増した。" }
            ]
          },
          {
            "sentence_id": 5,
            "chunks": [
              { "en": "In addition,", "is_important": true, "ja": "さらに、" },
              { "en": "lifelong learning will become essential", "is_important": false, "ja": "生涯学習が不可欠になるだろう" },
              { "en": "for workers.", "is_important": false, "ja": "労働者にとって。" }
            ]
          }
        ]
      }
    ];

    // アプリ状態
    let folders = [];
    let texts = [];
    let currentTextId = null;
    let targetParentFolderId = null;
    let deleteTarget = null;
    let expandedFolderIds = new Set();
    let isTreeInit = false;
    let lastSelectedFolderId = localStorage.getItem('ondoc_last_folder_v1') || "";
    let currentTheme = localStorage.getItem('ondoc_theme_v1') || "indigo";

    // 読解表示設定
    let config = {
      showSlash: true,
      showHighlight: true,
      transMode: 'tap',
      isRaw: false
    };
    let tappedChunks = {};

    // 読解タブ内タイマー状態
    let readerTimerRunning = false;
    let readerTimerStart = 0;
    let readerElapsedBase = 0;
    let readerTimerInterval = null;
    let readerSelectedRating = 0;

    // 単独タイマー状態
    let standaloneTimerRunning = false;
    let standaloneTimerStart = 0;
    let standaloneElapsedBase = 0;
    let standaloneTimerInterval = null;
    let standaloneSelectedRating = 0;
    let standaloneFreeHistory = JSON.parse(localStorage.getItem('ondoc_free_history') || '[]');

    document.addEventListener('DOMContentLoaded', () => {
      applyTheme(currentTheme);
      loadDataFromStorage();
      setupEventListeners();
      updateToggleStyles();
      renderTree();
      switchView('reader');
    });

    function applyTheme(themeName) {
      currentTheme = themeName;
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem('ondoc_theme_v1', themeName);

      const themeColors = {
        indigo: '#4f46e5',
        mint: '#0d9488',
        rose: '#e11d48',
        amber: '#d97706',
        dark: '#0f172a'
      };
      document.getElementById('theme-color-meta').setAttribute('content', themeColors[themeName] || '#4f46e5');
    }

    function loadDataFromStorage() {
      try {
        const storedFolders = localStorage.getItem('ondoc_folders_v1');
        const storedTexts = localStorage.getItem('ondoc_texts_v1');
        if (storedFolders && storedTexts) {
          folders = JSON.parse(storedFolders);
          texts = JSON.parse(storedTexts);
        }
      } catch (e) {
        console.error("Storage load error:", e);
      }

      if (!Array.isArray(folders) || folders.length === 0 || !Array.isArray(texts) || texts.length === 0) {
        folders = JSON.parse(JSON.stringify(SAMPLE_FOLDERS));
        texts = JSON.parse(JSON.stringify(SAMPLE_TEXTS));
        saveToLocalStorage();
      }

      texts.forEach(t => {
        if (!t.wordCount) t.wordCount = countWordsInTextData(t.data);
        if (t.readCount === undefined) t.readCount = 0;
        if (!Array.isArray(t.history)) t.history = [];
      });

      if (texts.length > 0) currentTextId = texts[0].id;
    }

    function saveToLocalStorage() {
      localStorage.setItem('ondoc_folders_v1', JSON.stringify(folders));
      localStorage.setItem('ondoc_texts_v1', JSON.stringify(texts));
    }

    function countWordsInTextData(data) {
      if (!Array.isArray(data)) return 0;
      let total = 0;
      data.forEach(s => {
        if (Array.isArray(s.chunks)) {
          s.chunks.forEach(c => {
            if (c.en) {
              const words = c.en.trim().split(/\s+/).filter(w => w.length > 0);
              total += words.length;
            }
          });
        }
      });
      return total;
    }

    function switchView(viewName) {
      document.getElementById('view-reader').classList.toggle('hidden', viewName !== 'reader');
      document.getElementById('view-library').classList.toggle('hidden', viewName !== 'library');
      document.getElementById('view-timer').classList.toggle('hidden', viewName !== 'timer');
      document.getElementById('view-import').classList.toggle('hidden', viewName !== 'import');

      document.getElementById('toolbar-controls').style.display = (viewName === 'reader') ? 'flex' : 'none';

      const navs = {
        reader: document.getElementById('nav-reader'),
        library: document.getElementById('nav-library'),
        timer: document.getElementById('nav-timer'),
        import: document.getElementById('nav-import')
      };

      Object.keys(navs).forEach(key => {
        if (key === viewName) {
          navs[key].className = "flex-1 flex flex-col items-center justify-center gap-1 theme-brand-text font-bold transition py-1 active:scale-95";
        } else {
          navs[key].className = "flex-1 flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-700 transition font-medium py-1 active:scale-95";
        }
      });

      if (viewName === 'reader') renderReader();
      if (viewName === 'library') renderTree();
      if (viewName === 'timer') renderStandaloneTimerView();
      if (viewName === 'import') renderFolderSelectOptions();
    }

    function setupEventListeners() {
      // PWA Install
      document.getElementById('btn-pwa-install').onclick = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') document.getElementById('btn-pwa-install').classList.add('hidden');
          deferredPrompt = null;
        }
      };

      // 設定モーダル
      document.getElementById('btn-open-settings').onclick = () => document.getElementById('modal-settings').classList.remove('hidden');
      document.getElementById('btn-close-settings').onclick = () => document.getElementById('modal-settings').classList.add('hidden');
      
      document.querySelectorAll('[data-set-theme]').forEach(btn => {
        btn.onclick = () => {
          applyTheme(btn.dataset.setTheme);
          document.getElementById('modal-settings').classList.add('hidden');
        };
      });

      // ナビゲーション切り替え
      document.getElementById('nav-reader').onclick = () => switchView('reader');
      document.getElementById('nav-library').onclick = () => switchView('library');
      document.getElementById('nav-timer').onclick = () => switchView('timer');
      document.getElementById('nav-import').onclick = () => switchView('import');

      // インポート操作
      document.getElementById('btn-cancel-import').onclick = () => switchView('reader');
      document.getElementById('btn-add-root-folder').onclick = () => openFolderModal(null);
      document.getElementById('btn-cancel-folder').onclick = closeFolderModal;
      document.getElementById('btn-save-folder').onclick = handleSaveFolder;

      // バックアップ / 復元
      document.getElementById('btn-export-data').onclick = handleExportData;
      document.getElementById('btn-import-data').onclick = () => document.getElementById('file-input-backup').click();
      document.getElementById('file-input-backup').onchange = handleImportBackupFile;

      document.getElementById('import-folder-select').addEventListener('change', (e) => {
        lastSelectedFolderId = e.target.value;
        localStorage.setItem('ondoc_last_folder_v1', lastSelectedFolderId);
      });

      document.getElementById('btn-paste-clipboard').onclick = async () => {
        try {
          const text = await navigator.clipboard.readText();
          document.getElementById('import-json').value = text;
        } catch (err) {
          alert('クリップボードの読み取りに対応していません。手動で貼り付けてください。');
        }
      };

      // 読解トグル
      document.getElementById('toggle-slash').onclick = () => { config.showSlash = !config.showSlash; updateToggleStyles(); renderReader(); };
      document.getElementById('toggle-highlight').onclick = () => { config.showHighlight = !config.showHighlight; updateToggleStyles(); renderReader(); };
      document.getElementById('toggle-raw').onclick = () => { config.isRaw = !config.isRaw; updateToggleStyles(); renderReader(); };

      ['tap', 'all', 'none'].forEach(mode => {
        document.getElementById(`mode-${mode}`).onclick = () => {
          config.transMode = mode;
          tappedChunks = {};
          updateToggleStyles();
          renderReader();
        };
      });

      document.getElementById('btn-save-import').onclick = handleSaveImport;

      // 削除モーダル
      document.getElementById('btn-open-delete').onclick = () => {
        const activeText = texts.find(t => t.id === currentTextId);
        if (!activeText) return;
        deleteTarget = { type: 'text', id: activeText.id };
        document.getElementById('delete-modal-heading').textContent = "文章を削除しますか？";
        document.getElementById('delete-target-title').textContent = `「${activeText.title}」`;
        document.getElementById('modal-delete').classList.remove('hidden');
      };

      document.getElementById('btn-cancel-delete').onclick = () => document.getElementById('modal-delete').classList.add('hidden');
      document.getElementById('btn-confirm-delete').onclick = handleConfirmDelete;

      // --- 【読解タブ内】統合タイマー イベント ---
      document.getElementById('btn-reader-start').onclick = startReaderTimer;
      document.getElementById('btn-reader-stop').onclick = stopReaderTimer;
      document.getElementById('btn-reader-reset').onclick = resetReaderTimer;
      document.getElementById('btn-reader-save-record').onclick = saveReaderTimerRecord;

      document.getElementById('reader-count-plus').onclick = () => {
        const activeText = texts.find(t => t.id === currentTextId);
        if (!activeText) return;
        activeText.readCount += 1;
        saveToLocalStorage();
        updateReaderTimerDisplay();
      };

      document.getElementById('reader-count-minus').onclick = () => {
        const activeText = texts.find(t => t.id === currentTextId);
        if (!activeText) return;
        activeText.readCount = Math.max(0, activeText.readCount - 1);
        saveToLocalStorage();
        updateReaderTimerDisplay();
      };

      document.querySelectorAll('#reader-star-rating i').forEach(star => {
        star.onclick = () => {
          const rating = parseInt(star.dataset.star, 10);
          setReaderStarRating(readerSelectedRating === rating ? 0 : rating);
        };
      });

      // --- 【独立音読タイマー】 イベント ---
      document.getElementById('btn-standalone-start').onclick = startStandaloneTimer;
      document.getElementById('btn-standalone-stop').onclick = stopStandaloneTimer;
      document.getElementById('btn-standalone-reset').onclick = resetStandaloneTimer;
      document.getElementById('btn-standalone-save-record').onclick = saveStandaloneTimerRecord;

      document.getElementById('standalone-text-select').onchange = (e) => {
        const val = e.target.value;
        if (val === 'free') {
          document.getElementById('standalone-word-count').value = 100;
          document.getElementById('standalone-read-count').textContent = 1;
        } else {
          const selected = texts.find(t => t.id === val);
          if (selected) {
            document.getElementById('standalone-word-count').value = selected.wordCount || 100;
            document.getElementById('standalone-read-count').textContent = selected.readCount + 1;
          }
        }
        renderStandaloneTimerHistoryList();
      };

      document.getElementById('btn-standalone-count-plus').onclick = () => {
        const selectVal = document.getElementById('standalone-text-select').value;
        if (selectVal !== 'free') {
          const activeText = texts.find(t => t.id === selectVal);
          if (activeText) {
            activeText.readCount += 1;
            saveToLocalStorage();
            document.getElementById('standalone-read-count').textContent = activeText.readCount + 1;
            return;
          }
        }
        const el = document.getElementById('standalone-read-count');
        el.textContent = parseInt(el.textContent, 10) + 1;
      };

      document.getElementById('btn-standalone-count-minus').onclick = () => {
        const selectVal = document.getElementById('standalone-text-select').value;
        if (selectVal !== 'free') {
          const activeText = texts.find(t => t.id === selectVal);
          if (activeText) {
            activeText.readCount = Math.max(0, activeText.readCount - 1);
            saveToLocalStorage();
            document.getElementById('standalone-read-count').textContent = activeText.readCount + 1;
            return;
          }
        }
        const el = document.getElementById('standalone-read-count');
        el.textContent = Math.max(1, parseInt(el.textContent, 10) - 1);
      };

      document.querySelectorAll('#standalone-star-rating i').forEach(star => {
        star.onclick = () => {
          const rating = parseInt(star.dataset.star, 10);
          setStandaloneStarRating(standaloneSelectedRating === rating ? 0 : rating);
        };
      });
    }

    function updateToggleStyles() {
      const slashBtn = document.getElementById('toggle-slash');
      slashBtn.className = config.showSlash
        ? "flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1 theme-card theme-brand-text border shadow-sm"
        : "flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1 border border-slate-200 text-slate-400";

      const hlBtn = document.getElementById('toggle-highlight');
      hlBtn.className = config.showHighlight
        ? "flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1 theme-card text-rose-600 border shadow-sm"
        : "flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1 border border-slate-200 text-slate-400";

      const rawBtn = document.getElementById('toggle-raw');
      rawBtn.className = config.isRaw
        ? "flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1 bg-emerald-600 text-white shadow-sm"
        : "flex-shrink-0 px-2.5 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1 border border-slate-200 text-slate-600";

      ['tap', 'all', 'none'].forEach(mode => {
        const btn = document.getElementById(`mode-${mode}`);
        if (config.transMode === mode) {
          btn.className = "px-2 py-0.5 rounded-md transition theme-card theme-brand-text font-bold shadow-sm";
        } else {
          btn.className = "px-2 py-0.5 rounded-md transition text-slate-500 font-medium";
        }
      });
    }

    // ------------------- ライブラリ表示 -------------------
    function renderTree() {
      const container = document.getElementById('tree-container');
      container.innerHTML = '';

      if (!isTreeInit && folders.length > 0) {
        folders.forEach(f => expandedFolderIds.add(f.id));
        isTreeInit = true;
      }

      function buildFolderTree(parentId, level) {
        const ul = document.createElement('ul');
        ul.className = level > 0 ? "pl-4 ml-3 border-l-2 border-slate-200/80 space-y-1 my-1" : "space-y-1";

        const subFolders = folders.filter(f => f.parentId === parentId);
        subFolders.forEach(f => {
          const li = document.createElement('li');
          const isExpanded = expandedFolderIds.has(f.id);

          const childTextCount = texts.filter(t => t.folderId === f.id).length;
          const childFolderCount = folders.filter(sub => sub.parentId === f.id).length;
          const totalItems = childTextCount + childFolderCount;

          const folderHeader = document.createElement('div');
          folderHeader.className = "flex items-center justify-between p-2.5 rounded-xl text-slate-700 bg-slate-100/80 hover:bg-slate-200/60 font-semibold cursor-pointer transition select-none group";
          
          folderHeader.innerHTML = `
            <div class="flex items-center gap-2 truncate">
              <i class="fa-solid ${isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'} text-slate-400 text-xs w-3"></i>
              <i class="fa-solid ${isExpanded ? 'fa-folder-open text-amber-500' : 'fa-folder text-amber-400'} text-base"></i>
              <span class="truncate text-sm font-bold">${escapeHtml(f.name)}</span>
              <span class="text-[10px] font-medium text-slate-400 bg-white/80 px-2 py-0.5 rounded-full border border-slate-200/60">${totalItems}件</span>
            </div>
            <div class="flex items-center gap-1">
              <button title="サブフォルダ追加" class="btn-add-sub p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-white rounded-lg transition"><i class="fa-solid fa-plus text-xs"></i></button>
              <button title="フォルダ削除" class="btn-del-folder p-1.5 text-slate-400 hover:text-rose-600 hover:bg-white rounded-lg transition"><i class="fa-solid fa-trash-can text-xs"></i></button>
            </div>
          `;

          folderHeader.onclick = () => {
            if (expandedFolderIds.has(f.id)) expandedFolderIds.delete(f.id);
            else expandedFolderIds.add(f.id);
            renderTree();
          };

          folderHeader.querySelector('.btn-add-sub').onclick = (e) => { e.stopPropagation(); openFolderModal(f.id); };
          folderHeader.querySelector('.btn-del-folder').onclick = (e) => {
            e.stopPropagation();
            deleteTarget = { type: 'folder', id: f.id };
            document.getElementById('delete-modal-heading').textContent = "フォルダを削除しますか？";
            document.getElementById('delete-target-title').textContent = `「${f.name}」とその中の全データ`;
            document.getElementById('modal-delete').classList.remove('hidden');
          };

          li.appendChild(folderHeader);

          if (isExpanded) {
            li.appendChild(buildFolderTree(f.id, level + 1));
          }
          ul.appendChild(li);
        });

        const childTexts = texts.filter(t => t.folderId === parentId);
        childTexts.forEach(t => {
          const li = document.createElement('li');
          const isActive = t.id === currentTextId;
          li.className = `p-2.5 px-3 rounded-xl cursor-pointer transition flex items-center justify-between gap-2.5 ${
            isActive ? 'theme-brand-bg text-white font-bold shadow-sm' : 'hover:bg-slate-100/80 bg-white border border-slate-200/50'
          }`;
          
          li.innerHTML = `
            <div class="flex items-center gap-2.5 truncate min-w-0">
              <i class="fa-regular fa-file-lines ${isActive ? 'text-white/80' : 'text-slate-400'} text-xs flex-shrink-0"></i>
              <span class="truncate text-xs md:text-sm font-medium tracking-tight">${escapeHtml(t.title)}</span>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
              <span class="text-[10px] ${isActive ? 'bg-black/20 text-white' : 'bg-slate-100 text-slate-500'} px-2 py-0.5 rounded-full font-mono-num">${t.readCount || 0}回音読</span>
              <button title="文章削除" class="btn-del-text p-1.5 ${isActive ? 'text-white/80 hover:text-white' : 'text-slate-400 hover:text-rose-600'} rounded-lg transition">
                <i class="fa-solid fa-trash-can text-xs"></i>
              </button>
            </div>
          `;

          li.onclick = (e) => {
            e.stopPropagation();
            currentTextId = t.id;
            tappedChunks = {};
            resetReaderTimer();
            renderTree();
            switchView('reader');
          };

          const delBtn = li.querySelector('.btn-del-text');
          if (delBtn) {
            delBtn.onclick = (e) => {
              e.stopPropagation();
              deleteTarget = { type: 'text', id: t.id };
              document.getElementById('delete-modal-heading').textContent = "文章を削除しますか？";
              document.getElementById('delete-target-title').textContent = `「${t.title}」`;
              document.getElementById('modal-delete').classList.remove('hidden');
            };
          }

          ul.appendChild(li);
        });

        return ul;
      }

      container.appendChild(buildFolderTree(null, 0));
    }

    function renderFolderSelectOptions() {
      const select = document.getElementById('import-folder-select');
      select.innerHTML = '<option value="">(ルート / フォルダなし)</option>';

      function addOptions(parentId, prefix) {
        const sub = folders.filter(f => f.parentId === parentId);
        sub.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.id;
          opt.textContent = prefix + f.name;
          select.appendChild(opt);
          addOptions(f.id, prefix + "　");
        });
      }
      addOptions(null, "📂 ");

      if (lastSelectedFolderId && Array.from(select.options).some(opt => opt.value === lastSelectedFolderId)) {
        select.value = lastSelectedFolderId;
      } else {
        select.value = "";
      }
    }

    function getFolderPath(folderId) {
      if (!folderId) return "ルート";
      const path = [];
      let curr = folders.find(f => f.id === folderId);
      while (curr) {
        path.unshift(curr.name);
        curr = folders.find(f => f.id === curr.parentId);
      }
      return path.join(' / ');
    }

    // ------------------- 読解画面表示 -------------------
    function renderReader() {
      const activeText = texts.find(t => t.id === currentTextId);
      const readerContent = document.getElementById('reader-content');
      const currentTitleEl = document.getElementById('current-title');
      const headerFolderTag = document.getElementById('header-folder-tag');
      const emptyState = document.getElementById('empty-state');
      const timerPanel = document.getElementById('reader-timer-panel');

      if (!activeText) {
        currentTitleEl.textContent = "文章がありません";
        headerFolderTag.textContent = "";
        readerContent.innerHTML = '';
        emptyState.classList.remove('hidden');
        timerPanel.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      timerPanel.classList.remove('hidden');
      currentTitleEl.textContent = activeText.title;
      headerFolderTag.textContent = getFolderPath(activeText.folderId);
      readerContent.innerHTML = '';

      updateReaderTimerDisplay();

      if (config.isRaw) {
        const p = document.createElement('p');
        p.className = "leading-relaxed font-normal tracking-wide";
        const fullText = activeText.data.map(s => s.chunks.map(c => c.en).join(' ')).join(' ');
        p.textContent = fullText;
        readerContent.appendChild(p);
        return;
      }

      if (config.transMode === 'none') readerContent.classList.add('mode-no-trans');
      else readerContent.classList.remove('mode-no-trans');

      activeText.data.forEach((sentence, sIdx) => {
        const sentenceDiv = document.createElement('div');
        sentenceDiv.className = "sentence-block";

        sentence.chunks.forEach((chunk, cIdx) => {
          const chunkKey = `${sIdx}-${cIdx}`;
          const isLastChunk = cIdx === sentence.chunks.length - 1;

          const chunkWrap = document.createElement('div');
          chunkWrap.className = "chunk-box chunk-touch cursor-pointer";
          
          chunkWrap.onclick = () => {
            if (config.transMode === 'tap') {
              tappedChunks[chunkKey] = !tappedChunks[chunkKey];
              renderReader();
            }
          };

          const enSpan = document.createElement('span');
          enSpan.className = "chunk-en select-none tracking-wide";
          
          if (config.showHighlight && chunk.is_important) {
            const words = chunk.en.split(' ');
            if (words.length > 0) {
              const firstWord = words[0];
              const restWords = words.slice(1).join(' ');

              const redWordSpan = document.createElement('span');
              redWordSpan.className = "text-rose-600 font-semibold bg-rose-50 px-1 rounded";
              redWordSpan.textContent = firstWord;

              enSpan.appendChild(redWordSpan);
              if (restWords) enSpan.appendChild(document.createTextNode(' ' + restWords));
            } else {
              enSpan.textContent = chunk.en;
            }
          } else {
            enSpan.textContent = chunk.en;
          }

          chunkWrap.appendChild(enSpan);

          let showJa = false;
          if (config.transMode === 'all') showJa = true;
          if (config.transMode === 'tap' && tappedChunks[chunkKey]) showJa = true;

          if (showJa && chunk.ja) {
            const jaSpan = document.createElement('span');
            jaSpan.className = "chunk-ja";
            jaSpan.textContent = chunk.ja;
            chunkWrap.appendChild(jaSpan);
          }

          sentenceDiv.appendChild(chunkWrap);

          if (config.showSlash && !isLastChunk) {
            const slashSpan = document.createElement('span');
            slashSpan.className = "slash-mark";
            slashSpan.textContent = "/";
            sentenceDiv.appendChild(slashSpan);
          }
        });

        readerContent.appendChild(sentenceDiv);
      });
    }

    // ------------------- 【読解タブ内】統合タイマー ロジック -------------------
    function updateReaderTimerDisplay() {
      const activeText = texts.find(t => t.id === currentTextId);
      if (!activeText) return;
      document.getElementById('reader-read-count').textContent = activeText.readCount + 1;
    }

    function formatTime(ms) {
      const totalMs = Math.max(0, Math.floor(ms));
      const m = Math.floor((totalMs % 3600000) / 60000);
      const s = Math.floor((totalMs % 60000) / 1000);
      const tenths = Math.floor((totalMs % 1000) / 100);
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(m)}:${pad(s)}.${tenths}`;
    }

    function computeWpm(wordCount, ms) {
      if (!wordCount || wordCount <= 0 || ms <= 0) return 0;
      return Math.round(wordCount / (ms / 60000));
    }

    function startReaderTimer() {
      if (readerTimerRunning) return;
      readerTimerRunning = true;
      readerTimerStart = Date.now();
      readerTimerInterval = setInterval(() => {
        const ms = readerElapsedBase + (Date.now() - readerTimerStart);
        document.getElementById('reader-timer-display').textContent = formatTime(ms);
        const activeText = texts.find(t => t.id === currentTextId);
        const wpm = computeWpm(activeText ? activeText.wordCount : 0, ms);
        document.getElementById('reader-wpm-live').textContent = wpm > 0 ? `${wpm}` : '—';
      }, 100);

      document.getElementById('btn-reader-start').disabled = true;
      document.getElementById('btn-reader-start').classList.add('opacity-50');
      document.getElementById('btn-reader-stop').disabled = false;
      document.getElementById('btn-reader-stop').classList.remove('opacity-50', 'cursor-not-allowed');
    }

    function stopReaderTimer() {
      if (!readerTimerRunning) return;
      readerElapsedBase += Date.now() - readerTimerStart;
      readerTimerRunning = false;
      clearInterval(readerTimerInterval);

      document.getElementById('btn-reader-start').disabled = false;
      document.getElementById('btn-reader-start').classList.remove('opacity-50');
      document.getElementById('btn-reader-stop').disabled = true;
      document.getElementById('btn-reader-stop').classList.add('opacity-50', 'cursor-not-allowed');
    }

    function resetReaderTimer() {
      clearInterval(readerTimerInterval);
      readerTimerRunning = false;
      readerElapsedBase = 0;
      readerTimerStart = 0;

      document.getElementById('reader-timer-display').textContent = '00:00.0';
      document.getElementById('reader-wpm-live').textContent = '—';

      document.getElementById('btn-reader-start').disabled = false;
      document.getElementById('btn-reader-start').classList.remove('opacity-50');
      document.getElementById('btn-reader-stop').disabled = true;
      document.getElementById('btn-reader-stop').classList.add('opacity-50', 'cursor-not-allowed');
    }

    function setReaderStarRating(rating) {
      readerSelectedRating = rating;
      document.querySelectorAll('#reader-star-rating i').forEach(star => {
        const r = parseInt(star.dataset.star, 10);
        star.className = r <= rating ? "fa-solid fa-star text-amber-400" : "fa-solid fa-star text-slate-300";
      });
    }

    function saveReaderTimerRecord() {
      const activeText = texts.find(t => t.id === currentTextId);
      if (!activeText) return;

      const ms = readerTimerRunning ? readerElapsedBase + (Date.now() - readerTimerStart) : readerElapsedBase;
      if (ms <= 0) return;

      if (readerTimerRunning) stopReaderTimer();

      activeText.readCount += 1;
      const wpm = computeWpm(activeText.wordCount, ms);
      const memoText = document.getElementById('reader-memo-input').value.trim();

      const record = {
        id: "rec-" + Date.now(),
        date: new Date().toISOString(),
        count: activeText.readCount,
        timeMs: ms,
        wpm: wpm,
        memo: memoText,
        rating: readerSelectedRating
      };

      activeText.history.unshift(record);
      saveToLocalStorage();

      document.getElementById('reader-memo-input').value = '';
      setReaderStarRating(0);
      resetReaderTimer();

      updateReaderTimerDisplay();
      renderTree();
    }

    function saveStandaloneTimerRecord() {
      const ms = standaloneTimerRunning ? standaloneElapsedBase + (Date.now() - standaloneTimerStart) : standaloneElapsedBase;
      if (ms <= 0) return;

      if (standaloneTimerRunning) stopStandaloneTimer();

      const selectVal = document.getElementById('standalone-text-select').value;
      const wordCount = parseInt(document.getElementById('standalone-word-count').value, 10) || 0;
      const readCountVal = parseInt(document.getElementById('standalone-read-count').textContent, 10) || 1;
      const wpm = computeWpm(wordCount, ms);
      const memoText = document.getElementById('standalone-memo').value.trim();

      const record = {
        id: "rec-" + Date.now(),
        date: new Date().toISOString(),
        count: readCountVal,
        timeMs: ms,
        wpm: wpm,
        memo: memoText,
        rating: standaloneSelectedRating
      };

      if (selectVal === 'free') {
        standaloneFreeHistory.unshift(record);
        localStorage.setItem('ondoc_free_history', JSON.stringify(standaloneFreeHistory));
      } else {
        const activeText = texts.find(t => t.id === selectVal);
        if (activeText) {
          activeText.readCount = readCountVal;
          activeText.history.unshift(record);
          saveToLocalStorage();
        }
      }

      document.getElementById('standalone-memo').value = '';
      setStandaloneStarRating(0);
      resetStandaloneTimer();
      renderStandaloneTimerHistoryList();
      renderTree();

    function renderStandaloneTimerHistoryList() {
      const selectVal = document.getElementById('standalone-text-select').value;
      const listEl = document.getElementById('standalone-history-list');

      let historyArr = [];
      if (selectVal === 'free') {
        historyArr = standaloneFreeHistory;
      } else {
        const activeText = texts.find(t => t.id === selectVal);
        if (activeText && activeText.history) historyArr = activeText.history;
      }

      if (historyArr.length === 0) {
        listEl.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">まだ履歴はありません。</p>';
        return;
      }

      listEl.innerHTML = historyArr.map(r => {
        const d = new Date(r.date);
        // 日付の文字色を見やすく改善 (濃いスレート色)
        const dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        
        let starsHtml = '';
        if (r.rating > 0) starsHtml = `<span class="text-amber-400 text-[10px] ml-1">` + '★'.repeat(r.rating) + `</span>`;

        return `
          <div class="p-2.5 bg-slate-50 border border-slate-200/80 rounded-xl flex flex-col gap-1">
            <div class="flex items-center justify-between text-xs">
              <div class="flex items-center gap-1.5 font-mono-num font-bold text-slate-700">
                <span class="theme-brand-text">${r.count}回目</span>
                <span>${formatTime(r.timeMs)}</span>
                <span class="text-slate-500 text-[11px]">(${r.wpm || 0} WPM)</span>
                ${starsHtml}
              </div>
              <button onclick="deleteStandaloneHistoryRecord('${r.id}')" class="text-slate-400 hover:text-rose-500 p-1 transition"><i class="fa-solid fa-xmark text-xs"></i></button>
            </div>
            ${r.memo ? `<p class="text-[11px] text-slate-600 bg-white p-1.5 rounded-lg border border-slate-100">${escapeHtml(r.memo)}</p>` : ''}
            <!-- 視認性を高めた日付表記 -->
            <span class="text-[10px] text-slate-500 font-semibold font-mono-num mt-0.5">${dateStr}</span>
          </div>
        `;
      }).join('');
    }

    function deleteStandaloneHistoryRecord(recordId) {
      if (!confirm('この音読履歴を削除しますか？')) return;

      const selectVal = document.getElementById('standalone-text-select').value;
      if (selectVal === 'free') {
        standaloneFreeHistory = standaloneFreeHistory.filter(r => r.id !== recordId);
        localStorage.setItem('ondoc_free_history', JSON.stringify(standaloneFreeHistory));
      } else {
        const activeText = texts.find(t => t.id === selectVal);
        if (activeText) {
          activeText.history = activeText.history.filter(r => r.id !== recordId);
          saveToLocalStorage();
        }
      }
      renderStandaloneTimerHistoryList();
    }

    // ------------------- モーダル & 保存処理 -------------------
    function openFolderModal(parentId) {
      targetParentFolderId = parentId;
      document.getElementById('modal-folder-title').textContent = parentId ? "サブフォルダを追加" : "新しいフォルダを作成";
      document.getElementById('folder-name-input').value = '';
      document.getElementById('modal-folder').classList.remove('hidden');
    }

    function closeFolderModal() {
      document.getElementById('modal-folder').classList.add('hidden');
    }

    function handleSaveFolder() {
      const name = document.getElementById('folder-name-input').value.trim();
      if (!name) return;

      const newFolder = { id: "f-" + Date.now(), name: name, parentId: targetParentFolderId };
      folders.push(newFolder);
      expandedFolderIds.add(newFolder.id);
      saveToLocalStorage();
      closeFolderModal();
      renderTree();
    }

    function handleSaveImport() {
      const errorEl = document.getElementById('import-error');
      errorEl.classList.add('hidden');

      const jsonStr = document.getElementById('import-json').value.trim();
      let titleStr = document.getElementById('import-title').value.trim();
      const folderId = document.getElementById('import-folder-select').value || null;

      if (!jsonStr) {
        showError('JSONコードが入力されていません。');
        return;
      }

      try {
        const parsed = JSON.parse(jsonStr);
        if (!Array.isArray(parsed) || parsed.length === 0 || !parsed[0].chunks) {
          throw new Error('フォーマットエラー');
        }

        if (!titleStr) titleStr = `英文テキスト ${texts.length + 1}`;

        const wordCount = countWordsInTextData(parsed);

        const newText = {
          id: "text-" + Date.now(),
          folderId: folderId,
          title: titleStr,
          wordCount: wordCount,
          readCount: 0,
          history: [],
          data: parsed
        };

        texts.push(newText);
        currentTextId = newText.id;
        if (folderId) expandedFolderIds.add(folderId);

        lastSelectedFolderId = folderId || "";
        localStorage.setItem('ondoc_last_folder_v1', lastSelectedFolderId);

        saveToLocalStorage();

        document.getElementById('import-title').value = '';
        document.getElementById('import-json').value = '';
        renderTree();
        switchView('reader');

      } catch (err) {
        showError('JSONの解析に失敗しました。ChatGPT等の出力をそのまま貼り付けてください。');
      }
    }

    function showError(msg) {
      const errorEl = document.getElementById('import-error');
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
    }

    function handleConfirmDelete() {
      if (!deleteTarget) return;

      if (deleteTarget.type === 'text') {
        texts = texts.filter(t => t.id !== deleteTarget.id);
        if (currentTextId === deleteTarget.id) {
          currentTextId = texts.length > 0 ? texts[0].id : null;
        }
      } else if (deleteTarget.type === 'folder') {
        const folderIdsToDelete = [deleteTarget.id];
        function collectChildren(fid) {
          const subs = folders.filter(f => f.parentId === fid);
          subs.forEach(s => {
            folderIdsToDelete.push(s.id);
            collectChildren(s.id);
          });
        }
        collectChildren(deleteTarget.id);

        folders = folders.filter(f => !folderIdsToDelete.includes(f.id));
        texts = texts.filter(t => !folderIdsToDelete.includes(t.folderId));

        if (!texts.find(t => t.id === currentTextId)) {
          currentTextId = texts.length > 0 ? texts[0].id : null;
        }
      }

      saveToLocalStorage();
      document.getElementById('modal-delete').classList.add('hidden');
      deleteTarget = null;
      renderTree();
      renderReader();
    }

    function handleExportData() {
      const backupData = {
        version: "OnDoc-1.0",
        exportDate: new Date().toISOString(),
        folders: folders,
        texts: texts,
        freeHistory: standaloneFreeHistory
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `ondoc_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function handleImportBackupFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.folders && imported.texts) {
            folders = imported.folders;
            texts = imported.texts;
            if (imported.freeHistory) standaloneFreeHistory = imported.freeHistory;
            if (texts.length > 0) currentTextId = texts[0].id;
            saveToLocalStorage();
            localStorage.setItem('ondoc_free_history', JSON.stringify(standaloneFreeHistory));
            renderTree();
            renderReader();
          }
        } catch (err) {
          console.error("Restore error", err);
        }
      };
      reader.readAsText(file);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
